  event.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "開啟中…";
  try {
    const material = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(new FormData(event.target).get("password")),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 300000, hash: "SHA-256" },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, payload);
    const html = new TextDecoder().decode(plain);
    sessionStorage.setItem("ch1-review-password", new FormData(event.target).get("password"));

    document.write(html);
    document.close();

    msg.textContent = "密碼不正確";
